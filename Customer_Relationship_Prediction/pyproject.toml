[project]
name = "customer-behavior"
version = "0.1.0"
description = "Streamlit dashboard for predicting customer churn, appetency, and upselling on the KDD Cup 2009 (Orange) dataset."
authors = [{ name = "Rafaela Schroeder" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "scikit-learn (>=1.4,<2.0)",
    "imbalanced-learn (>=0.12,<1.0)",
    "feature-engine (>=1.8,<2.0)",
    "streamlit (>=1.38,<2.0)",
    "plotly (>=5.24,<6.0)",
    "joblib (>=1.4,<2.0)",
    "duckdb (>=1.0,<2.0)",
]

[project.scripts]
elt = "customer_behavior.elt:main"
train = "customer_behavior.training:main"

[tool.poetry]
packages = [{ include = "customer_behavior", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
ruff = ">=0.6,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"